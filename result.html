<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#131315">
<title>판결 · 누가 이김?</title>
<link rel="stylesheet" href="./src/styles.css">
<style>
  .verdict { max-width: 720px; margin: 0 auto; padding: 32px 20px 56px; }
  .verdict .eyebrow { margin-bottom: 10px; }
  .verdict h1 { font-size: clamp(30px, 6vw, 44px); letter-spacing: -1.5px; line-height: 1.25; }
  .verdict .lead { color: var(--muted); margin-top: 10px; line-height: 1.6; }
  .faceoff { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin: 32px 0 8px; }
  .fighter { text-align: center; opacity: .55; }
  .fighter.win { opacity: 1; }
  .face { width: min(30vw, 150px); aspect-ratio: 1; border-radius: 50%; margin: 0 auto 12px; background: var(--panel) center/cover no-repeat; border: 3px solid var(--line); display: grid; place-items: center; font-size: 40px; font-weight: 800; color: var(--muted); }
  .fighter.win .face { border-color: var(--accent); box-shadow: 0 0 0 6px var(--color-accent-soft); }
  .fighter .name { font-size: 20px; font-weight: 800; letter-spacing: -.5px; }
  .fighter .tag { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: var(--accent-text); min-height: 16px; }
  .vs { font-size: 14px; font-weight: 800; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-top: 16px; }
  .card h2 { font-size: 15px; letter-spacing: 0; color: var(--muted); font-weight: 700; margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .row:first-of-type { border-top: 0; }
  .row b { font-size: 18px; }
  .row b:last-child { text-align: right; }
  .row span { text-align: center; color: var(--muted); font-size: 13px; }
  .rate { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin: 6px 0 10px; }
  .rate i { display: block; height: 100%; }
  .rate-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
  .actions { display: grid; gap: 10px; margin-top: 28px; }
  .actions .primary { width: 100%; justify-content: center; gap: 8px; text-decoration: none; color: var(--text); }
  .actions .ghost { min-height: 52px; border: 1px solid var(--line); background: transparent; border-radius: 4px; font-weight: 700; }
  .note { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main class="verdict screen" id="app"></main>
<script type="module" src="./src/result.js"></script>
</body>
</html>
